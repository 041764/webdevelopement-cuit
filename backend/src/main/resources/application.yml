server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: tutor-management-backend
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${APP_DB_PATH:backend/data/dev.db}
    hikari:
      connection-init-sql: PRAGMA foreign_keys=ON
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mybatis:
  type-handlers-package: com.kuapt.tutor.mapper.typehandler

app:
  jwt:
    issuer: ${APP_JWT_ISSUER:tutor-management}
    access-ttl: ${APP_JWT_ACCESS_TTL:6h}
    refresh-ttl: ${APP_JWT_REFRESH_TTL:12h}
    secret: ${APP_JWT_SECRET:change-me-in-dev-change-me-in-dev-change-me}
  password:
    pepper: ${APP_PASSWORD_PEPPER:dev-pepper}
